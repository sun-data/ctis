[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ctis"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
    {name = "Jacob D. Parker"},
    {name = "Charles C. Kankelborg"},
]
description = "A Python library for simulating and inverting observations from computed tomography imaging spectrographs."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "astropy",
    # 2.12.1 is the first release to require a version of numpy it works with
    "named-arrays>=2.12.1,<3",
    "optika~=2.1",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "interface-region-imaging-spectrograph",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "nbsphinx",
    "sphinx-codeautolink",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/sun-data/ctis"
Documentation = "https://ctis.readthedocs.io/en/latest"

[tool.setuptools]
packages = ["ctis"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.report]
exclude_also = [
    "return NotImplemented",
    "raise ValueError",
    "raise NotImplementedError",
]
